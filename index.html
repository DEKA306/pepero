
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빼빼로 먹기</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #171923;
    color: white;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 500px;
}

h1 {
    font-size: 32px;
}

.counter {
    font-size: 22px;
    margin: 30px 0 10px;
}

.progress {
    height: 10px;
    background: #343849;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 50px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #e9a05d;
    transition: width 0.1s;
}

.pepero-area {
    height: 180px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

.pepero {
    width: 300px;
    height: 18px;
    position: relative;
    border-radius: 10px;
    background: #d6a06a;
    box-shadow: inset 0 -4px #a96c3c;
    transform: rotate(-15deg);
    transform-origin: left center;
    transition: width 0.08s;
}

.chocolate {
    position: absolute;
    left: 0;
    top: 0;
    width: 85%;
    height: 100%;
    border-radius: 10px;
    background: repeating-linear-gradient(
        90deg,
        #63351f 0px,
        #63351f 8px,
        #77452b 8px,
        #77452b 13px
    );
}

button {
    background: #e9a05d;
    color: #24170e;
    border: none;
    padding: 15px 45px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

button:disabled {
    opacity: 0.5;
    cursor: default;
}

.message {
    margin-top: 25px;
    color: #e9a05d;
    font-size: 20px;
    min-height: 30px;
}

.controls {
    margin-top: 15px;
    color: #999;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <h1>빼빼로 먹기</h1>
    <p>빼빼로를 11111번 눌러 먹어보세요.</p>

    <div class="counter">
        <span id="count">0</span> / 11₩₩111
    </div>

    <div class="progress">
        <div class="progress-bar" id="bar"></div>
    </div>

    <div class="pepero-area" onclick="eat()">
        <div class="pepero" id="pepero">
            <div class="chocolate"></div>
        </div>
    </div>

    <button onclick="eat()" id="eatButton">
        한 입 먹기
    </button>

    <div class="message" id="message">
        아직 한 입도 먹지 않았어요.
    </div>

    <div class="controls">
        마우스 클릭 · SPACE · ENTER
    </div>

</div>

<script>
const TOTAL = 11111;
let count = 0;

function eat() {
    if (count >= TOTAL) return;

    count++;

    const remaining = TOTAL - count;
    const progress = count / TOTAL * 100;

    document.getElementById("count").textContent = count;

    document.getElementById("bar").style.width =
        progress + "%";

    const pepero = document.getElementById("pepero");

    // 먹을 때마다 길이 감소
    pepero.style.width =
        (300 * remaining / TOTAL) + "px";

    if (count === TOTAL) {
        pepero.style.display = "none";

        document.getElementById("eatButton").disabled = true;
        document.getElementById("eatButton").textContent = "다 먹었다!";

        document.getElementById("message").textContent =
            "축하합니다! 빼빼로를 전부 먹었습니다!";
    } else {
        document.getElementById("message").textContent =
            "맛있게 먹는 중...";
    }
}

// Space와 Enter 키 지원
document.addEventListener("keydown", function(event) {
    if (event.code === "Space" || event.code === "Enter") {
        event.preventDefault();

        // 키를 꾹 눌러도 반복 입력되지 않음
        if (event.repeat) return;

        eat();
    }
});
</script>

</body>
</html>
